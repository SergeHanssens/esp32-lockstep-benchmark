adapter serial CC:BA:97:14:2B:28
source [find board/esp32s3-builtin.cfg]
init
echo "AUDIT OpenOCD [version]"
echo "=== INJECTIE 1 INVOER-CRC (verwacht 0x1) ==="
halt
echo "  pre  g_det_totaal = [read_memory 0x3fc9473c 32 1]"
mww 0x3fc9475c 0x00000001
echo "  readback g_flip_invoer = [read_memory 0x3fc9475c 32 1]"
resume
sleep 800
echo "=== INJECTIE 2 VERWERKING (verwacht 0x2) ==="
halt
mww 0x3fc94758 0x00000040
echo "  readback g_flip_res = [read_memory 0x3fc94758 32 1]"
resume
sleep 800
echo "=== INJECTIE 3 UITVOER (verwacht 0x4) ==="
halt
mww 0x3fc94754 0x00000400
echo "  readback g_flip_uit = [read_memory 0x3fc94754 32 1]"
resume
sleep 800
echo "=== INJECTIE 4 ECHTE INVOER-DATABIT k.invoer idx5 bit7, PROPAGATIE (verwacht 0x7) ==="
halt
mww 0x3fc94750 0x00000080
echo "  readback g_flip_invoerdata = [read_memory 0x3fc94750 32 1]"
resume
sleep 800
echo "=== EIND: tellers en triggers ==="
halt
echo "  eind g_det_totaal = [read_memory 0x3fc9473c 32 1]"
echo "  eind g_det_invoer = [read_memory 0x3fc94748 32 1]"
echo "  eind g_det_res    = [read_memory 0x3fc94744 32 1]"
echo "  eind g_det_uit    = [read_memory 0x3fc94740 32 1]"
echo "  eind trig invoer,res,uit,invoerdata = [read_memory 0x3fc9475c 32 1] [read_memory 0x3fc94758 32 1] [read_memory 0x3fc94754 32 1] [read_memory 0x3fc94750 32 1]"
resume
shutdown
